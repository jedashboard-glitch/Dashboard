<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Reports</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#00387C;--blue-mid:#1a54a0;--blue-light:#e8f0fb;
  --green:#1a8c42;--green-bg:#d4edda;--green-txt:#155724;
  --amber:#c96a10;--amber-bg:#ffe5d0;--amber-txt:#7c3d0f;
  --red:#c0392b;--red-bg:#f8d7da;--red-txt:#721c24;
  --bg:#FAF8F6;--white:#fff;--border:#dee2e6;--border-light:#eaeef2;
  --text:#212529;--muted:#6c757d;
  --sidebar:220px;--topbar:58px;--r:6px;
  --shadow:0 1px 4px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.06);
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
#sidebar{width:var(--sidebar);background:#fff;border-right:1px solid #EDE9E4;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#logo-area{padding:14px 16px 12px;border-bottom:1px solid #EDE9E4;cursor:pointer}
.logo-main{font-size:19px;font-weight:800;color:var(--blue);letter-spacing:-.4px;line-height:1.1}
.logo-sub{font-size:10.5px;color:#6b7280;margin-top:3px;letter-spacing:.3px;font-style:italic}
#nav{padding:10px 0;flex:1}
.nav-section{padding:10px 14px 3px;font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;color:#374151;cursor:pointer;border-left:3px solid transparent;transition:all .15s;font-size:13px;user-select:none}
.nav-item:hover{background:#f3f4f6;color:#111827}
.nav-item.active{background:#eff6ff;color:var(--blue);border-left-color:var(--blue);font-weight:600}
.nav-item .ico{font-size:15px;width:19px;text-align:center;flex-shrink:0}
.nav-footer{padding:12px 14px;border-top:1px solid #EDE9E4;font-size:11px;color:#9ca3af}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:var(--topbar);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#topbar h1{font-size:17px;font-weight:700;color:var(--blue);flex:1}
#content{flex:1;overflow-y:auto;padding:20px 24px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card-hdr{padding:14px 18px;border-bottom:1px solid var(--border-light)}
.card-hdr h3{font-size:14px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:#f8f9fa;text-align:right;padding:8px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child,tbody td:first-child{text-align:left}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border-light);text-align:right;white-space:nowrap}
tbody tr.total td{font-weight:800;border-top:2px solid var(--border)}
tbody tr.result td{font-weight:800;color:var(--blue);background:var(--blue-light)}
tbody tr.section td:first-child{font-weight:700;color:var(--muted);padding-top:12px}
.pos{color:var(--green-txt)}.neg{color:var(--red-txt)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 18px;border-left:4px solid var(--blue)}
.kpi.g{border-left-color:var(--green)}.kpi.a{border-left-color:var(--amber)}.kpi.r{border-left-color:var(--red)}
.kpi-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:6px}
.kpi-val{font-size:20px;font-weight:800;color:var(--text)}
.bep-bar{position:relative;height:34px;background:var(--border-light);border-radius:6px;overflow:hidden;margin:10px 0}
.bep-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--amber),var(--green))}
.bep-marker{position:absolute;top:0;height:100%;width:2px;background:var(--blue)}
.bep-label{position:absolute;top:-20px;font-size:11px;color:var(--blue);font-weight:700;white-space:nowrap;transform:translateX(-50%)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:3px}
#toast{position:fixed;bottom:22px;right:22px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 18px;border-radius:var(--r);font-size:13px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .3s ease}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.inf{background:var(--blue)}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.muted-note{font-size:11.5px;color:var(--muted);padding:10px 18px}
.card-hdr{display:flex;align-items:center;gap:10px}
.card-hdr h3{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer;font-size:12.5px;font-weight:600}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-mid)}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:#f3f4f6}
.prev-tbl th:first-child,.prev-tbl td:first-child{text-align:left}
.prev-tbl td,.prev-tbl th{text-align:left}
.prev-tbl td.num,.prev-tbl th.num{text-align:right}
.row-act{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:3px 6px;border-radius:4px}
.icon-btn:hover{background:#eee}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:12.5px}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:10px;width:440px;max-width:92vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal-hdr{padding:18px 22px;border-bottom:1px solid var(--border-light);display:flex;align-items:center}
.modal-hdr h3{flex:1;font-size:16px}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{padding:9px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit}
.fg input[type=number],.fg input:disabled{text-align:right}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-ftr{padding:16px 22px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px}
</style>
</head>
<body>
<div id="app">
<nav id="sidebar">
  <div id="logo-area" onclick="location.href='index.html'">
    <div class="logo-main">📊 Dashboard</div>
    <div class="logo-sub">Gestió financera</div>
  </div>
  <div id="nav">
    <div class="nav-item" onclick="location.href='index.html'"><span class="ico">🏠</span> Inici</div>
    <div class="nav-section">Facturació</div>
    <div class="nav-item" onclick="location.href='factures-emeses.html'"><span class="ico">🧾</span> Factures emeses</div>
    <div class="nav-item" onclick="location.href='factures-rebudes.html'"><span class="ico">📥</span> Factures rebudes</div>
    <div class="nav-item" onclick="location.href='clients.html'"><span class="ico">🗂️</span> Clients</div>
    <div class="nav-item" onclick="location.href='proveidors.html'"><span class="ico">🏭</span> Proveïdors</div>

    <div class="nav-item" onclick="location.href='nomines.html'"><span class="ico">👥</span> Nòmines</div>

    <div class="nav-item active" onclick="location.href='reports.html'"><span class="ico">📈</span> Reports</div>
  </div>

</nav>
<main id="main">
  <header id="topbar">
    <h1>Reports</h1>
    <span id="user-email" style="font-size:12px;color:var(--muted);margin-right:4px"></span>
    <button class="btn btn-secondary btn-sm" onclick="doLogout()" style="padding:5px 10px;font-size:12px;border-radius:6px;background:#fff;border:1px solid var(--border);cursor:pointer">⏻ Sortir</button>

</main>
</div>
<div id="toast"></div>

<datalist id="etiquetes-existents"></datalist>
<div class="modal-bg" id="prev-modal-bg">
  <div class="modal">
    <div class="modal-hdr"><h3 id="prev-modal-title">Nova previsió</h3><button class="icon-btn" onclick="closePrevisioModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="p-id">

<script src="js/neon-client.js"></script>
<script>
const MESOS = ['Gen','Feb','Mar','Abr','Mai','Jun','Jul','Ago','Set','Oct','Nov','Des'];
let emeses=[], rebudes=[], nomines=[], quotes=[], previsions=[], ajornaments=[], ssAjornaments=[], saldoInicials=[];

if(requireAuth()) load();

function fmtMoney(n){ return (Number(n)||0).toLocaleString('ca-ES',{minimumFractionDigits:2,maximumFractionDigits:2}); }
const fmtMoney2 = fmtMoney;
function toast(msg,type='inf'){
  const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg;
  document.getElementById('toast').appendChild(el); setTimeout(()=>el.remove(),3500);
}

async function load(){
  try{
    let rebudesRaw;
    [emeses, rebudesRaw, nomines, quotes, previsions, ajornaments, ssAjornaments, saldoInicials] = await Promise.all([
      sbGet('factures_emeses','select=*'),
      sbGet('factures_rebudes','select=*'),
      sbGet('nomines','select=*'),
      sbGet('prestec_quotes','select=*'),
      sbGet('previsions_tresoreria','select=*&order=data.asc'),
      sbGet('iva_ajornaments','select=*'),
      sbGet('ss_ajornaments','select=*'),
      sbGet('saldo_inicial_tresoreria','select=*')
    ]);
    // Les factures anul·lades no compten en cap report (igual que a la resta del Dashboard).
    emeses = emeses.filter(r=>r.estat!=='anullada');
    rebudes = rebudesRaw.filter(r=>r.estat!=='anullada');
    fillAnys();
    populateEtiquetesDatalist();
    renderAll();
  }catch(e){ toast('Error carregant: '+e.message,'err'); }
}

function fillAnys(){
  const all = [...emeses.map(r=>r.data), ...rebudes.map(r=>r.data), ...nomines.map(r=>r.data), ...quotes.map(r=>r.data_prevista)];
  const anys = [...new Set(all.filter(Boolean).map(d=>d.slice(0,4)))].sort((a,b)=>b-a);
  const thisYear = String(new Date().getFullYear());
  if(!anys.includes(thisYear)) anys.unshift(thisYear);
  document.getElementById('f-any').innerHTML = anys.map(a=>`<option value="${a}">${a}</option>`).join('');
  document.getElementById('f-any').value = thisYear;
}

function showTab(tab){
  ['pl','tresoreria','puntmort'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===tab ? 'block':'none';
    document.querySelector(`.tab[data-tab="${t}"]`).classList.toggle('active', t===tab);
  });
}

function monthlySums(rows, dateField, valueFn, year){
  const sums = Array(12).fill(0);
  rows.forEach(r=>{
    const d = r[dateField];
    if(!d || !d.startsWith(year)) return;
    const m = Number(d.slice(5,7))-1;
    sums[m] += valueFn(r);
  });
  return sums;
}
const sum = arr => arr.reduce((a,b)=>a+b,0);
const addArr = (a,b) => a.map((v,i)=>v+b[i]);
const subArr = (a,b) => a.map((v,i)=>v-b[i]);

// Meritació per data de factura/nòmina (no per cobrament/pagament/data_pagament).
// Suma valueFn(r) de les files de "rows" la data de les quals cau al trimestre q
// (0-3) de l'any y.
function quarterSum(rows, y, q, valueFn){
  const first = q*3, last = first+2;
  return sum(rows.filter(r=>{
    if(!r.data) return false;
    const ry = Number(r.data.slice(0,4)), rm = Number(r.data.slice(5,7))-1;
    return ry===y && rm>=first && rm<=last;
  }).map(valueFn));
}
function isAjornat(any_liquidacio, trimestre){
  return ajornaments.some(a=>a.any_liquidacio===any_liquidacio && a.trimestre===trimestre && a.ajornat);
}

// Retorna el detall dels 4 trimestres que es paguen dins l'any seleccionat
// (T4 de l'any anterior + T1/T2/T3 de l'any en curs; el T4 de l'any en curs
// es paga el gener següent i sortirà en seleccionar aquell any).
function quartersDeLAny(year){
  const y = Number(year);
  const defs = [
    { qy:y-1, qi:3, label:'T4 '+(y-1), payMonth:0 },
    { qy:y,   qi:0, label:'T1 '+y,     payMonth:3 },
    { qy:y,   qi:1, label:'T2 '+y,     payMonth:6 },
    { qy:y,   qi:2, label:'T3 '+y,     payMonth:9 },
  ];
  return defs.map(d=>{
    const repercutit = quarterSum(emeses, d.qy, d.qi, r=>Number(r.iva_import)||0);
    const suportat = quarterSum(rebudes, d.qy, d.qi, r=>Number(r.iva_import)||0);
    const liquidacio = Math.max(0, repercutit - suportat);
    return { ...d, repercutit, suportat, liquidacio, ajornat: isAjornat(d.qy, d.qi) };
  });
}

function calcLiquidacioIva(year){
  const vals = Array(12).fill(0);
  quartersDeLAny(year).forEach(q=>{
    if(!q.ajornat) vals[q.payMonth] += q.liquidacio;
  });
  return vals;
}

async function toggleAjornament(any_liquidacio, trimestre, ajornat){
  try{
    if(ajornat){
      await sbPost('iva_ajornaments', { any_liquidacio, trimestre, ajornat:true });
    } else {
      await sbDelWhereCompound('iva_ajornaments', { any_liquidacio, trimestre });
    }
    ajornaments = await sbGet('iva_ajornaments','select=*');
    renderAll();
  }catch(e){ toast('Error desant ajornament: '+e.message,'err'); }
}

// Hisenda IRPF/111 (retenció de les nòmines): trimestral, mateixa mecànica que
// l'IVA (es paga el mes següent al tancament del trimestre), sense ajornament.
function calcIrpf111(year){
  const y = Number(year);
  const defs = [
    { qy:y-1, qi:3, payMonth:0 },
    { qy:y,   qi:0, payMonth:3 },
    { qy:y,   qi:1, payMonth:6 },
    { qy:y,   qi:2, payMonth:9 },
  ];
  const vals = Array(12).fill(0);
  defs.forEach(d=>{ vals[d.payMonth] += quarterSum(nomines, d.qy, d.qi, r=>Number(r.irpf)||0); });
  return vals;
}

function isSSAjornat(any_liquidacio, mes){
  return ssAjornaments.some(a=>a.any_liquidacio===any_liquidacio && a.mes===mes && a.ajornat);
}

// Retorna, per a l'any seleccionat, els mesos amb nòmines la SS dels quals es
// paga dins l'any (desembre de l'any anterior + gener-novembre de l'any en
// curs; la SS de desembre es paga el gener següent i sortirà en seleccionar
// aquell any). Només es mostren mesos amb import.
function monthsForSS(year){
  const y = Number(year);
  const defs = [{ ay:y-1, am:11, payY:y, payM:0 }];
  for(let m=0; m<11; m++) defs.push({ ay:y, am:m, payY:y, payM:m+1 });
  return defs.map(d=>{
    const key = String(d.ay)+'-'+String(d.am+1).padStart(2,'0');
    const rowsMes = nomines.filter(r=>r.data && r.data.startsWith(key));
    const ssTrab = sum(rowsMes.map(r=>Number(r.ss_trab)||0));
    const ssEmpresa = sum(rowsMes.map(r=>Number(r.ss_empresa)||0));
    return { ay:d.ay, am:d.am, payMonth:d.payM, label: MESOS[d.am]+' '+d.ay, ssTrab, ssEmpresa, ajornat: isSSAjornat(d.ay, d.am) };
  }).filter(d=>d.ssTrab || d.ssEmpresa);
}

function calcSS(year){
  const ssTrab = Array(12).fill(0);
  const ssEmpresa = Array(12).fill(0);
  monthsForSS(year).forEach(m=>{
    ssTrab[m.payMonth] += m.ssTrab;
    if(!m.ajornat) ssEmpresa[m.payMonth] += m.ssEmpresa;
  });
  return { ssTrab, ssEmpresa };
}

async function toggleSSAjornament(any_liquidacio, mes, ajornat){
  try{
    if(ajornat){
      await sbPost('ss_ajornaments', { any_liquidacio, mes, ajornat:true });
    } else {
      await sbDelWhereCompound('ss_ajornaments', { any_liquidacio, mes });
    }
    ssAjornaments = await sbGet('ss_ajornaments','select=*');
    renderAll();
  }catch(e){ toast('Error desant ajornament: '+e.message,'err'); }
}

function groupPrevisions(year){
  const forYear = previsions.filter(p=>p.data && p.data.startsWith(String(year)));
  const groups = {};
  forYear.forEach(p=>{
    const key = p.tipus+'|'+p.etiqueta.trim();
    if(!groups[key]) groups[key] = { etiqueta:p.etiqueta.trim(), tipus:p.tipus, valors:Array(12).fill(0) };
    const m = Number(p.data.slice(5,7))-1;
    groups[key].valors[m] += Number(p.import)||0;
  });
  return Object.values(groups);
}

function populateEtiquetesDatalist(){
  const etiquetes = [...new Set(previsions.map(p=>p.etiqueta.trim()).filter(Boolean))].sort();
  document.getElementById('etiquetes-existents').innerHTML = etiquetes.map(e=>`<option value="${e}">`).join('');
}

function renderAll(){
  const year = document.getElementById('f-any').value;
  renderPL(year);
  renderTresoreria(year);
  renderPuntMort(year);
}

function rowHTML(label, arr, opts={}){
  const cls = opts.cls || '';
  const fmt = opts.money2 ? fmtMoney2 : fmtMoney;
  const cells = arr.map(v=>`<td class="${v<0?'neg':''}">${fmt(v)}</td>`).join('');
  return `<tr class="${cls}"><td>${label}</td>${cells}<td>${fmt(sum(arr))}</td></tr>`;
}

function renderPL(year){
  const ingressos = monthlySums(emeses,'data', r=>Number(r.base), year);
  const costVar = monthlySums(rebudes,'data', r=>r.tipus_cost==='variable'?Number(r.base):0, year);
  const costFix = monthlySums(rebudes,'data', r=>r.tipus_cost==='fix'?Number(r.base):0, year);
  const personal = monthlySums(nomines,'data', r=>Number(r.import_brut)+Number(r.ss_empresa), year);
  const financeres = monthlySums(quotes,'data_prevista', r=>Number(r.import_interessos), year);
  const totalDespeses = addArr(addArr(addArr(costVar,costFix),personal),financeres);
  const resultat = subArr(ingressos, totalDespeses);
  const margeContrib = subArr(ingressos, costVar);

  const head = '<th></th>'+MESOS.map(m=>`<th>${m}</th>`).join('')+'<th>Total</th>';
  document.getElementById('tab-pl').innerHTML = `
    <div class="card">
      <div class="card-hdr"><h3>Compte de resultats ${year} (base imposable, criteri de meritació)</h3></div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>${head}</tr></thead>
        <tbody>
          ${rowHTML('Ingressos', ingressos)}
          <tr class="section"><td>Costos variables</td>${MESOS.map(()=>'<td></td>').join('')}<td></td></tr>
          ${rowHTML('Compres i serveis variables', costVar.map(v=>-v))}
          ${rowHTML('Marge de contribució', margeContrib, {cls:'total'})}
          <tr class="section"><td>Costos fixos</td>${MESOS.map(()=>'<td></td>').join('')}<td></td></tr>
          ${rowHTML('Compres i serveis fixos', costFix.map(v=>-v))}
          ${rowHTML('Personal (brut + SS empresa)', personal.map(v=>-v))}
          ${rowHTML('Despeses financeres (interessos)', financeres.map(v=>-v))}
          ${rowHTML('Resultat (EBIT)', resultat, {cls:'result'})}
        </tbody>
      </table>
      </div>
      <p class="muted-note">Els imports es basen en la base imposable (sense IVA) i la data de la factura/nòmina/quota, no en la data de cobrament o pagament.</p>
    </div>`;
}

function renderTresoreria(year){
  const cobraments = monthlySums(emeses.filter(r=>r.cobrat),'data_cobrament', r=>Number(r.total), year);
  const pagFactures = monthlySums(rebudes.filter(r=>r.pagat),'data_pagament', r=>Number(r.total), year);
  const pagNomines = monthlySums(nomines.filter(r=>r.pagat),'data_pagament', r=>Number(r.import_net), year);
  const pagQuotes = monthlySums(quotes.filter(r=>r.pagat),'data_pagament', r=>Number(r.import_total), year);
  const ivaTrimestral = calcLiquidacioIva(year);
  const irpf111 = calcIrpf111(year);
  const { ssTrab, ssEmpresa } = calcSS(year);

  const prevGroups = groupPrevisions(year);
  const prevCobrament = prevGroups.filter(g=>g.tipus==='cobrament');
  const prevPagament = prevGroups.filter(g=>g.tipus==='pagament');

  const totalCobraments = prevCobrament.reduce((acc,g)=>addArr(acc,g.valors), cobraments);
  const totalPagaments = prevPagament.reduce((acc,g)=>addArr(acc,g.valors),
    [pagFactures,ivaTrimestral,irpf111,pagNomines,ssTrab,ssEmpresa,pagQuotes].reduce(addArr));
  const saldoMes = subArr(totalCobraments, totalPagaments);

  const saldoInicialAny = Number((saldoInicials.find(s=>s.any_liquidacio===Number(year))||{}).import || 0);
  const saldoInicialRow = [], saldoFinalRow = [];
  let running = saldoInicialAny;
  saldoMes.forEach((v,i)=>{ saldoInicialRow[i]=running; running+=v; saldoFinalRow[i]=running; });

  const head = '<th></th>'+MESOS.map(m=>`<th>${m}</th>`).join('')+'<th>Total</th>';
  const blankRow = MESOS.map(()=>'<td></td>').join('');
  const prevRowsCobrament = prevCobrament.map(g=>rowHTML('(+) '+g.etiqueta, g.valors)).join('');
  const prevRowsPagament = prevPagament.map(g=>rowHTML('(-) '+g.etiqueta, g.valors.map(v=>-v))).join('');

  document.getElementById('tab-tresoreria').innerHTML = `
    <div class="card">
      <div class="card-hdr"><h3>Moviments de tresoreria ${year} (criteri de caixa)</h3><button class="btn btn-secondary" onclick="editSaldoInicial('${year}')">✏️ Saldo inicial</button></div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>${head}</tr></thead>
        <tbody>
          ${rowHTML('Saldo inicial', saldoInicialRow, {cls:'total'})}
          ${rowHTML('Cobraments (factures emeses)', cobraments)}
          ${prevRowsCobrament}
          <tr class="section"><td>Pagaments</td>${blankRow}<td></td></tr>
          ${rowHTML('Proveïdors / creditors', pagFactures.map(v=>-v))}
          <tr class="section"><td>Hisenda</td>${blankRow}<td></td></tr>
          ${rowHTML('Liquidació IVA trimestral', ivaTrimestral.map(v=>-v))}
          ${rowHTML('Hisenda IRPF/111 (sous)', irpf111.map(v=>-v))}
          <tr class="section"><td>Personal</td>${blankRow}<td></td></tr>
          ${rowHTML('Salari net', pagNomines.map(v=>-v))}
          ${rowHTML('SS Trab', ssTrab.map(v=>-v))}
          ${rowHTML('SS Empresa', ssEmpresa.map(v=>-v))}
          <tr class="section"><td>Finançament</td>${blankRow}<td></td></tr>
          ${rowHTML('Quotes de préstecs', pagQuotes.map(v=>-v))}
          ${prevRowsPagament}
          ${rowHTML('Saldo del mes', saldoMes, {cls:'total'})}
          ${rowHTML('Saldo final', saldoFinalRow, {cls:'result'})}
        </tbody>
      </table>
      </div>
      <p class="muted-note">El Saldo inicial de gener és editable ("✏️ Saldo inicial" de dalt) i correspon al saldo bancari real a 1 de gener de ${year}; els mesos següents l'arrosseguen sols des del Saldo final anterior. La liquidació d'IVA i l'IRPF/111 no compensen saldos negatius entre períodes. Les línies de previsió són manuals — quan la factura/cobrament real es registri, recorda ajustar o eliminar la previsió corresponent.</p>
    </div>

    ${renderIvaQuarters(year)}
    ${renderSSMonths(year)}
    ${renderPrevisionsPanel(year)}
  `;
}

async function editSaldoInicial(year){
  const y = Number(year);
  const current = Number((saldoInicials.find(s=>s.any_liquidacio===y)||{}).import || 0);
  const input = prompt(`Saldo bancari real a 1 de gener de ${y}:`, current);
  if(input===null) return;
  const value = Number(input.replace(',','.'));
  if(Number.isNaN(value)){ toast('Import no vàlid','err'); return; }
  try{
    await sbDelWhereCompound('saldo_inicial_tresoreria', { any_liquidacio: y });
    await sbPost('saldo_inicial_tresoreria', { any_liquidacio: y, import: value });
    saldoInicials = await sbGet('saldo_inicial_tresoreria','select=*');
    toast('Saldo inicial desat','ok');
    renderAll();
  }catch(e){ toast('Error desant: '+e.message,'err'); }
}

function renderSSMonths(year){
  const ms = monthsForSS(year);
  const rows = ms.map(m=>`
    <tr>
      <td>${m.label}</td>
      <td class="num">${fmtMoney2(m.ssTrab)}</td>
      <td class="num">${fmtMoney2(m.ssEmpresa)}</td>
      <td>${MESOS[m.payMonth]}</td>
      <td>
        ${m.ajornat
          ? `<button class="btn btn-secondary" onclick="toggleSSAjornament(${m.ay},${m.am},false)">✕ Treure ajornament</button>`
          : `<button class="btn btn-secondary" onclick="toggleSSAjornament(${m.ay},${m.am},true)">📆 Marcar ajornat</button>`}
      </td>
    </tr>`).join('');
  return `
    <div class="card">
      <div class="card-hdr"><h3>SS Trab / SS Empresa per mes</h3></div>
      <div style="overflow-x:auto">
      <table class="prev-tbl">
        <thead><tr><th>Mes nòmina</th><th class="num">SS Trab</th><th class="num">SS Empresa</th><th>Mes pagament</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty">Cap nòmina amb SS registrada.</td></tr>'}</tbody>
      </table>
      </div>
      <p class="muted-note">"Marcar ajornat" només afecta la SS Empresa d'aquell mes (la SS Trab mai s'ajorna) — treu-la de la fila automàtica perquè la reparteixis amb previsions manuals.</p>
    </div>`;
}

function renderIvaQuarters(year){
  const qs = quartersDeLAny(year);
  const rows = qs.map(q=>`
    <tr>
      <td>${q.label}</td>
      <td class="num">${fmtMoney2(q.repercutit)}</td>
      <td class="num">${fmtMoney2(q.suportat)}</td>
      <td class="num"><strong>${fmtMoney2(q.liquidacio)}</strong></td>
      <td>${MESOS[q.payMonth]}</td>
      <td>
        ${q.ajornat
          ? `<button class="btn btn-secondary" onclick="toggleAjornament(${q.qy},${q.qi},false)">✕ Treure ajornament</button>`
          : `<button class="btn btn-secondary" onclick="toggleAjornament(${q.qy},${q.qi},true)">📆 Marcar ajornat</button>`}
      </td>
    </tr>`).join('');
  return `
    <div class="card">
      <div class="card-hdr"><h3>Liquidació d'IVA per trimestre</h3></div>
      <div style="overflow-x:auto">
      <table class="prev-tbl">
        <thead><tr><th>Trimestre</th><th class="num">Repercutit</th><th class="num">Suportat</th><th class="num">Liquidació</th><th>Mes pagament</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
      <p class="muted-note">Si un trimestre es marca com a ajornat, el seu import deixa d'incloure's a la fila automàtica "Liquidació IVA trimestral" — reparteix-lo manualment amb línies de previsió (p.ex. "Hisenda IVA ajornat") als mesos que us hagi concedit Hisenda.</p>
    </div>`;
}

function renderPrevisionsPanel(year){
  const forYear = previsions.filter(p=>p.data && p.data.startsWith(String(year))).sort((a,b)=>a.data<b.data?-1:1);
  const rows = forYear.map(p=>`
    <tr>
      <td>${p.etiqueta}</td>
      <td>${p.tipus==='cobrament'?'Cobrament':'Pagament'}</td>
      <td>${new Date(p.data+'T00:00:00').toLocaleDateString('ca-ES')}</td>
      <td class="num">${fmtMoney2(p.import)}</td>
      <td>${p.notes||''}</td>
      <td class="row-act">
        <button class="icon-btn" onclick="openPrevisioModal(${p.id})" title="Editar">✏️</button>
      </td>
    </tr>`).join('');
  return `
    <div class="card">
      <div class="card-hdr"><h3>Previsions manuals ${year}</h3><button class="btn btn-primary" onclick="openPrevisioModal()">+ Nova previsió</button></div>
      <div style="overflow-x:auto">
      <table class="prev-tbl">
        <thead><tr><th>Etiqueta</th><th>Tipus</th><th>Data</th><th class="num">Import</th><th>Notes</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
      ${!forYear.length ? '<div class="empty">Cap previsió per a '+year+'.</div>' : ''}
    </div>`;
}

function renderPuntMort(year){
  const ingressosAny = sum(monthlySums(emeses,'data', r=>Number(r.base), year));
  const costVarAny = sum(monthlySums(rebudes,'data', r=>r.tipus_cost==='variable'?Number(r.base):0, year));
  const costFixAny = sum(monthlySums(rebudes,'data', r=>r.tipus_cost==='fix'?Number(r.base):0, year));
  const personalAny = sum(monthlySums(nomines,'data', r=>Number(r.import_brut)+Number(r.ss_empresa), year));
  const financeresAny = sum(monthlySums(quotes,'data_prevista', r=>Number(r.import_interessos), year));
  const costosFixosAny = costFixAny + personalAny + financeresAny;
  const margeContribAny = ingressosAny - costVarAny;
  const marge_pct = ingressosAny ? margeContribAny/ingressosAny : 0;
  const puntMort = marge_pct>0 ? costosFixosAny/marge_pct : null;
  const distancia = puntMort!==null ? ingressosAny - puntMort : null;

  const maxScale = Math.max(ingressosAny, puntMort||0)*1.15 || 1;
  const pctIngressos = Math.min(100, ingressosAny/maxScale*100);
  const pctPuntMort = Math.min(100, (puntMort||0)/maxScale*100);

  document.getElementById('tab-puntmort').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Ingressos ${year}</div><div class="kpi-val">${fmtMoney(ingressosAny)}</div></div>
      <div class="kpi a"><div class="kpi-label">Costos fixos ${year}</div><div class="kpi-val">${fmtMoney(costosFixosAny)}</div></div>
      <div class="kpi g"><div class="kpi-label">Marge de contribució</div><div class="kpi-val">${(marge_pct*100).toFixed(1)}%</div></div>
      <div class="kpi ${distancia!==null && distancia>=0 ? 'g':'r'}"><div class="kpi-label">Punt mort (ingressos)</div><div class="kpi-val">${puntMort!==null?fmtMoney(puntMort):'—'}</div></div>
    </div>
    <div class="card">
      <div class="card-hdr"><h3>Distància al punt mort — ${year}</h3></div>
      <div style="padding:24px 22px">
        ${puntMort===null ? '<p class="muted-note">No es pot calcular: el marge de contribució és nul o negatiu.</p>' : `
        <div class="bep-bar">
          <div class="bep-fill" style="width:${pctIngressos}%"></div>
          <div class="bep-marker" style="left:${pctPuntMort}%"><span class="bep-label" style="left:0">Punt mort: ${fmtMoney(puntMort)}</span></div>
        </div>
        <p style="font-size:13px;margin-top:26px">
          Amb un marge de contribució del <strong>${(marge_pct*100).toFixed(1)}%</strong> i uns costos fixos anuals de <strong>${fmtMoney(costosFixosAny)}</strong>,
          calen <strong>${fmtMoney(puntMort)}</strong> d'ingressos anuals per cobrir costos.
          Ingressos actuals: <strong>${fmtMoney(ingressosAny)}</strong>
          (<span class="${distancia>=0?'pos':'neg'}">${distancia>=0?'+':''}${fmtMoney(distancia)} ${distancia>=0?'per sobre':'per sota'} del punt mort</span>).
        </p>`}
      </div>
      <p class="muted-note">Costos fixos = compres/serveis marcats com a "fix" + personal (brut+SS empresa) + interessos de préstecs. Costos variables = compres/serveis marcats com a "variable".</p>
    </div>`;
}

function openPrevisioModal(id){
  const p = id ? previsions.find(x=>x.id===id) : null;
  document.getElementById('prev-modal-title').textContent = p ? 'Editar previsió' : 'Nova previsió';
  document.getElementById('p-id').value = p ? p.id : '';
  document.getElementById('p-etiqueta').value = p ? p.etiqueta : '';
  document.getElementById('p-tipus').value = p ? p.tipus : 'cobrament';
  document.getElementById('p-data').value = p ? p.data : todayStr();
  document.getElementById('p-import').value = p ? p.import : '';
  document.getElementById('p-notes').value = p ? (p.notes||'') : '';
  document.getElementById('p-btn-del').style.display = p ? 'inline-flex' : 'none';
  document.getElementById('prev-modal-bg').classList.add('show');
}
function closePrevisioModal(){ document.getElementById('prev-modal-bg').classList.remove('show'); }

async function savePrevisio(){
  const id = document.getElementById('p-id').value;
  const data = {
    etiqueta: document.getElementById('p-etiqueta').value.trim(),
    tipus: document.getElementById('p-tipus').value,
    data: document.getElementById('p-data').value,
    import: Number(document.getElementById('p-import').value)||0,
    notes: document.getElementById('p-notes').value.trim() || null
  };
  if(!data.etiqueta || !data.data){ toast('Etiqueta i data són obligatòries','err'); return; }
  try{
    if(id){ await sbPatch('previsions_tresoreria', id, data); toast('Previsió actualitzada','ok'); }
    else { await sbPost('previsions_tresoreria', data); toast('Previsió creada','ok'); }
    closePrevisioModal();
    previsions = await sbGet('previsions_tresoreria','select=*&order=data.asc');
    populateEtiquetesDatalist();
    renderAll();
  }catch(e){ toast('Error desant: '+e.message,'err'); }
}

async function delPrevisio(){
  const id = document.getElementById('p-id').value;
  if(!id || !confirm('Segur que vols eliminar aquesta previsió?')) return;
  try{
    await sbDel('previsions_tresoreria', id);
    toast('Previsió eliminada','ok');
    closePrevisioModal();
    previsions = await sbGet('previsions_tresoreria','select=*&order=data.asc');
    populateEtiquetesDatalist();
    renderAll();
  }catch(e){ toast('Error eliminant: '+e.message,'err'); }
}
</script>
</body>
